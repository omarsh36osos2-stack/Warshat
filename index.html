<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#107c41"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="جدول">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>جدول</title>
<style>
:root{color-scheme:light;--bg:#fff;--z:#eef0f3;--fg:#1f2328;--bd:#d9dde3;--hd:#f1f3f5;--ac:#107c41;--sel:#cfeadb;--tb:#f8f9fa;--mu:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;background:#fff;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px "Segoe UI",Tahoma,system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tb{flex:none;background:var(--tb);border-bottom:1px solid var(--bd);padding:6px;display:flex;flex-direction:column;gap:6px}
.t1{display:flex;align-items:center;gap:8px}
#q{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text}
#bd{margin-inline-start:18px;flex:none;color:#d93025;border-color:#d93025;background:var(--bg);padding:7px 10px}#bd:active{background:#d93025;color:#fff}
.t2{display:flex;gap:6px;overflow-x:auto;align-items:center}
button{font:inherit;padding:7px 11px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:9px;white-space:nowrap;cursor:pointer}
button:active{background:var(--sel)}button:disabled{opacity:.4}
#cnt,#st{color:var(--mu);font-size:12px;white-space:nowrap}
#grid,#sz,#rows{overflow-anchor:none}
#grid{touch-action:pan-y;flex:1;overflow-y:auto;overflow-x:hidden;position:relative;outline:none;background:var(--bg);-webkit-overflow-scrolling:touch}
#sz{position:relative;width:100%}
#hd{position:sticky;top:0;height:34px;z-index:7;background:var(--hd);display:flex;border-bottom:1px solid var(--bd);box-sizing:border-box}
.cn{width:52px;flex:none;border-left:1px solid var(--bd)}
.h{flex:1;text-align:center;line-height:33px;font-weight:700;color:var(--mu)}
#rows{position:absolute;right:0;left:0}
.empty{padding:40px;text-align:center;color:var(--mu)}
.r{display:flex;height:46px}
.rn{width:52px;flex:none;box-sizing:border-box;background:var(--hd);border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px}
.rn.on{color:var(--ac);font-weight:700}
.c{flex:1;min-width:0;box-sizing:border-box;border-bottom:1px solid var(--bd);padding:0 12px;display:flex;align-items:center;background:var(--bg)}
.c span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:20px;max-width:100%;word-break:break-word}
.c.z{background:var(--z)}.c.in{background:var(--sel)}.c.fl{background:var(--sel);border-bottom:2px dashed var(--ac)}
.c.act{outline:2px solid var(--ac);outline-offset:-2px}
#ed{position:absolute;z-index:5;display:none;right:52px;left:0;box-sizing:border-box;min-height:46px;border:2px solid var(--ac);padding:12px;margin:0;font:inherit;line-height:20px;background:#fff;color:var(--fg);outline:none;resize:none;overflow:hidden;-webkit-user-select:text;user-select:text;border-radius:0;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#fh{position:absolute;z-index:4;left:16px;width:14px;height:14px;background:var(--ac);border:2px solid #fff;border-radius:4px;touch-action:none;transform:translate(-50%,-50%);cursor:crosshair}
@media (pointer:coarse){#fh{width:26px;height:26px;border-radius:8px}}
#menu{position:fixed;z-index:30;display:none;min-width:210px;background:#fff;color:var(--fg);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:6px}
#menu button{display:block;width:100%;text-align:right;border:0;background:none;padding:13px 14px;font-size:16px;border-radius:10px}
.mt{font-weight:700;padding:8px 14px 4px}.mh{color:var(--mu);font-size:12px;padding:4px 14px 8px}
.mrow{display:flex;gap:8px;align-items:center;padding:4px 8px}.mrow button{text-align:center!important;border:1px solid var(--bd)!important;padding:11px 8px!important}
#fn{width:90px;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:9px;background:#fff;color:var(--fg);-webkit-user-select:text;user-select:text}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:9px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;white-space:nowrap}
</style></head><body>
<div id="tb">
<div class="t1"><input id="q" type="search" placeholder="🔍 بحث وتصفية…"><span id="cnt"></span><button id="bd" title="حذف الصف المحدد">🗑</button></div>
<div class="t2"><button id="bu" disabled>↶ تراجع</button><button id="br" disabled>↷ إعادة</button><button id="bi">➕ إدراج صف</button><button id="bim">📥 استيراد</button><button id="bex">📤 تصدير</button><button id="bin" hidden>📲 تثبيت التطبيق</button><span id="st"></span></div>
<input id="imp" type="file" hidden accept=".xlsx,.csv,.txt">
</div>
<div id="grid" tabindex="0"><div id="sz"><div id="hd"><div class="cn"></div><div class="h">الاسم</div></div><div id="rows"></div><textarea id="ed" rows="1" dir="auto"></textarea><div id="fh"></div></div></div>
<div id="menu"></div><div id="ts"></div>
<script>
const $=id=>document.getElementById(id);
const ROWS=5000,RH=46,HH=34,cl=(x,a,b)=>Math.max(a,Math.min(b,x));
let D=Array(ROWS).fill(null),hist=[],redo=[],ar=0,fr=0,editing=false,drag=false,filling=false,ft=0,lastP=null,lk='',tm=0,raf=0,pend=false,lp=0,lpFired=false,tapPend=false,sx=0,sy=0,ptype='mouse',menuOn=false,view=null,vpos=null,N=ROWS;
const g=$('grid'),sz=$('sz'),rw=$('rows'),ed=$('ed'),fh=$('fh'),menu=$('menu');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const gv=r=>(D[r]&&D[r][0])||'';
function sv(r,v){if(v===''){if(D[r])D[r][0]='';return}(D[r]=D[r]||[])[0]=v}
const pos=r=>view?(vpos.has(r)?vpos.get(r):-1):r;
const rowAt=p=>view?view[p]:p;
const sp=()=>{const a=pos(ar),b=pos(fr);return{p1:Math.min(a,b),p2:Math.max(a,b)}};
const rg=()=>({r1:Math.min(ar,fr),r2:Math.max(ar,fr)});
function rows(){const s=sp(),a=[];if(s.p1>=0)for(let p=s.p1;p<=s.p2;p++)a.push(rowAt(p));return a}
function toast(t){const e=$('ts');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2200)}
sz.style.height=HH+ROWS*RH+'px';
function upd(){$('bu').disabled=!hist.length;$('br').disabled=!redo.length}
function render(){
 const st=g.scrollTop,vh=g.clientHeight,s=sp();
 if(!N){rw.innerHTML='<div class="empty">لا توجد نتائج</div>';rw.style.top=HH+'px';fh.style.display='none';upd();return}
 const p0=Math.max(0,Math.floor(st/RH)-3),p1=Math.min(N-1,Math.ceil((st+vh)/RH)+3);let h='';
 for(let p=p0;p<=p1;p++){
  const r=rowAt(p),ir=p>=s.p1&&p<=s.p2;let k=p%2?' z':'';
  if(ir)k=' in';
  if(filling&&((ft>s.p2&&p>s.p2&&p<=ft)||(ft<s.p1&&p<s.p1&&p>=ft)))k=' fl';
  if(r===ar)k+=' act';
  h+=`<div class="r"><div class="rn${ir?' on':''}" data-r="${r}">${r+1}</div><div class="c${k}" dir="auto" data-r="${r}"><span>${esc(gv(r))}</span></div></div>`;
 }
 rw.innerHTML=h;rw.style.top=HH+p0*RH+'px';
 fh.style.display=editing||view||s.p1<0?'none':'block';fh.style.top=HH+(s.p2+1)*RH+'px';upd();
}
function reveal(p){const t=p*RH,vh=g.clientHeight-HH;if(t<g.scrollTop)g.scrollTop=t;else if(t+RH>g.scrollTop+vh)g.scrollTop=t+RH-vh}
function selP(p,ext){if(!N)return;p=cl(p,0,N-1);const r=rowAt(p);if(ext)fr=r;else ar=fr=r;reveal(p);render()}
/* save */
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open('xl-sheet',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>res(q.result);q.onerror=()=>rej()})}
async function save(){
 pend=false;
 try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('k','readwrite');t.objectStore('k').put({D,cols:1},'d');t.oncomplete=res;t.onerror=rej});$('st').textContent='تم الحفظ ✓'}
 catch(e){try{localStorage.setItem('xl',JSON.stringify({D,cols:1}));$('st').textContent='تم الحفظ ✓'}catch(e2){$('st').textContent='تعذّر الحفظ'}}
}
function dirty(){pend=true;$('st').textContent='جارٍ الحفظ…';clearTimeout(tm);tm=setTimeout(save,300)}
addEventListener('pagehide',()=>{if(pend)save()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&pend)save()});
/* history */
function push(e){hist.push(e);if(hist.length>200)hist.shift();redo=[]}
function apply(ch){
 const old=ch.map(([r])=>[r,gv(r)]);
 for(const[r,v]of ch)sv(r,v);
 push({u:()=>{for(let i=old.length-1;i>=0;i--)sv(old[i][0],old[i][1])},r:()=>{for(const[r,v]of ch)sv(r,v)}});
 dirty();render();
}
function undo(){const e=hist[hist.length-1];if(!e)return;if(e.s&&view)return toast('ألغِ البحث أولاً');hist.pop();e.u();redo.push(e);dirty();render()}
function redoF(){const e=redo[redo.length-1];if(!e)return;if(e.s&&view)return toast('ألغِ البحث أولاً');redo.pop();e.r();hist.push(e);dirty();render()}
$('bu').onclick=undo;$('br').onclick=redoF;
/* edit */
function grow(){ed.style.height='auto';ed.style.height=Math.max(RH,ed.scrollHeight+2)+'px'}
function edit(r,init){
 const p=pos(r);if(p<0)return;
 if(editing)commit();ar=fr=r;reveal(p);editing=true;
 ed.style.top=HH+p*RH+'px';ed.style.display='block';
 ed.value=init==null?gv(r):init;grow();ed.focus();const n=ed.value.length;ed.setSelectionRange(n,n);render();
}
function commit(){
 if(!editing)return;editing=false;const v=ed.value.replace(/\n/g,' ');ed.style.display='none';
 if(v!==gv(ar))apply([[ar,v]]);else render();
}
ed.addEventListener('input',grow);
ed.addEventListener('keydown',e=>{
 const k=e.key;
 if((k==='Enter'&&!e.shiftKey)||k==='Tab'){e.preventDefault();commit();g.focus({preventScroll:true});selP(pos(ar)+1)}
 else if(k==='Escape'){editing=false;ed.style.display='none';g.focus({preventScroll:true});render()}
});
ed.addEventListener('blur',()=>{if(editing)commit()});
/* pointer */
rw.addEventListener('pointerdown',e=>{
 const t=e.target.closest('[data-r]');if(!t)return;const r=+t.dataset.r;ptype=e.pointerType;
 if(e.pointerType!=='mouse'){
  if(t.classList.contains('rn')){if(editing)commit();ar=fr=r;render();return}
  tapPend=true;lpFired=false;sx=e.clientX;sy=e.clientY;clearTimeout(lp);
  const x=e.clientX,y=e.clientY;
  lp=setTimeout(()=>{lpFired=true;tapPend=false;if(navigator.vibrate)navigator.vibrate(15);showMenu(x,y,r)},500);
  return;
 }
 if(e.button===2)return;
 if(editing)commit();
 if(e.shiftKey)fr=r;else ar=fr=r;
 drag=!t.classList.contains('rn');lastP=e;render();if(drag)requestAnimationFrame(tick);
});
let tapR=-1,tapT=0;
rw.addEventListener('click',e=>{
 if(ptype==='mouse'||!tapPend||lpFired)return;tapPend=false;clearTimeout(lp);
 const t=e.target.closest('.c');if(!t)return;const r=+t.dataset.r,n=Date.now();
 if(r===tapR&&n-tapT<450){tapR=-1;edit(r)}else{tapR=r;tapT=n;if(editing)commit();ar=fr=r;render()}
});
rw.addEventListener('dblclick',e=>{if(ptype==='mouse'&&e.target.closest('.c'))edit(ar)});
g.addEventListener('contextmenu',e=>{e.preventDefault();const t=e.target.closest('.c');if(t&&!menuOn)showMenu(e.clientX,e.clientY,+t.dataset.r)});
fh.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(editing)commit();filling=true;ft=sp().p2;lastP=e;try{fh.setPointerCapture(e.pointerId)}catch(x){}requestAnimationFrame(tick)});
document.addEventListener('pointermove',e=>{
 if(drag||filling)lastP=e;
 if(lp&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)){clearTimeout(lp);lp=0;tapPend=false}
});
document.addEventListener('pointerup',()=>{
 clearTimeout(lp);
 if(filling){filling=false;const s=sp();if(ft>s.p2||ft<s.p1)doFill(ft);else render();return}
 drag=false;
});
document.addEventListener('pointercancel',()=>{clearTimeout(lp);tapPend=false;drag=false;if(filling){filling=false;render()}});
document.addEventListener('pointerdown',e=>{if(menuOn&&!menu.contains(e.target))hideMenu()},true);
function tick(){
 if(!drag&&!filling)return;const p=lastP;
 if(p){
  const b=g.getBoundingClientRect();
  if(p.clientY>b.bottom-40)g.scrollTop+=16;else if(p.clientY<b.top+HH+40)g.scrollTop-=16;
  const q=cl(Math.floor((p.clientY-b.top+g.scrollTop-HH)/RH),0,N-1),k=q+','+g.scrollTop;
  if(k!==lk){lk=k;if(filling)ft=q;else fr=rowAt(q);render()}
 }
 requestAnimationFrame(tick);
}
g.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})},{passive:true});
addEventListener('resize',render);
/* fill */
function doFill(t){
 const R=rg(),n=R.r2-R.r1+1,dn=t>R.r2,ch=[];
 const v=[];for(let r=R.r1;r<=R.r2;r++)v.push(gv(r));
 const nums=v.map(x=>String(x).trim()!==''&&isFinite(x)?+x:NaN);
 const ser=n>1&&nums.every(x=>!isNaN(x)),step=ser?nums[1]-nums[0]:0;
 const m=n===1?v[0].match(/^(.*?)(\d+)$/):null,tx=m&&m[1]!=='';
 const put=(rr,k)=>{
  let val;
  if(ser){const x=dn?nums[n-1]+step*k:nums[0]-step*k;val=String(+x.toFixed(10))}
  else if(tx){const nv=Math.max(0,+m[2]+(dn?k:-k));val=m[1]+String(nv).padStart(m[2].length,'0')}
  else val=v[dn?(k-1)%n:n-1-((k-1)%n)];
  ch.push([rr,val]);
 };
 if(dn)for(let rr=R.r2+1;rr<=t;rr++)put(rr,rr-R.r2);else for(let rr=R.r1-1;rr>=t;rr--)put(rr,R.r1-rr);
 if(dn){ar=R.r1;fr=t}else{ar=R.r2;fr=t}
 apply(ch);
}
/* long-press menu */
function hideMenu(){menu.style.display='none';menuOn=false}
function placeMenu(x,y){
 menu.style.display='block';menuOn=true;const w=menu.offsetWidth,h=menu.offsetHeight;
 menu.style.left=cl(x-w/2,8,innerWidth-w-8)+'px';
 menu.style.top=cl(y+h+24<innerHeight?y+14:y-h-14,8,innerHeight-h-8)+'px';
}
function showMenu(x,y,r){
 const s=sp(),p=pos(r);if(p<s.p1||p>s.p2){ar=fr=r;render()}
 menu.innerHTML='<button id="mf">⬇⬆ تعبئة</button><button id="mc">🧹 مسح البيانات</button>';
 $('mf').onclick=fillUI;
 $('mc').onclick=()=>{hideMenu();const n=clearSel();toast(n?'تم المسح — يمكنك التراجع':'لا توجد بيانات')};
 placeMenu(x,y);
}
function fillUI(){
 if(view){hideMenu();return toast('ألغِ البحث أولاً لاستخدام التعبئة')}
 menu.innerHTML='<div class="mt">تعبئة الخلية</div><div class="mrow"><input id="fn" type="number" min="1" max="5000" value="10" inputmode="numeric"><span>صف</span></div><div class="mrow"><button id="fd">⬇ للأسفل</button><button id="fu">⬆ للأعلى</button></div><div class="mh">أو اسحب المربع الأخضر بالإصبع</div>';
 const go=d=>{
  const k=cl(parseInt($('fn').value)||0,1,ROWS),R=rg();
  const t=d>0?Math.min(ROWS-1,R.r2+k):Math.max(0,R.r1-k);
  hideMenu();if(t===(d>0?R.r2:R.r1))return toast('لا توجد مساحة للتعبئة');
  doFill(t);toast('تمت التعبئة');
 };
 $('fd').onclick=()=>go(1);$('fu').onclick=()=>go(-1);
 const t=parseFloat(menu.style.top),h=menu.offsetHeight;menu.style.top=cl(t,8,innerHeight-h-8)+'px';
}
/* keyboard / clipboard */
g.addEventListener('keydown',e=>{
 if(editing)return;const k=e.key,m=e.ctrlKey||e.metaKey;
 if(m&&k.toLowerCase()==='z'){e.preventDefault();return e.shiftKey?redoF():undo()}
 if(m&&k.toLowerCase()==='y'){e.preventDefault();return redoF()}
 if(m&&k.toLowerCase()==='a'){e.preventDefault();if(N){ar=rowAt(0);fr=rowAt(N-1);render()}return}
 if(m)return;
 const mv={ArrowDown:1,ArrowUp:-1,PageDown:10,PageUp:-10}[k];
 if(mv){e.preventDefault();return selP(pos(e.shiftKey?fr:ar)+mv,e.shiftKey)}
 if(k==='Tab'){e.preventDefault();return selP(pos(ar)+(e.shiftKey?-1:1))}
 if(k==='Enter'||k==='F2'){e.preventDefault();return edit(ar)}
 if(k==='Delete'||k==='Backspace'){e.preventDefault();return void clearSel()}
 if(k.length===1&&!e.altKey){e.preventDefault();edit(ar,k)}
});
function clearSel(){const ch=rows().filter(r=>gv(r)!=='').map(r=>[r,'']);if(ch.length)apply(ch);return ch.length}
const tsv=()=>rows().map(gv).join('\n');
const free=()=>editing||(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName));
document.addEventListener('copy',e=>{if(free())return;e.clipboardData.setData('text/plain',tsv());e.preventDefault()});
document.addEventListener('cut',e=>{if(free())return;e.clipboardData.setData('text/plain',tsv());e.preventDefault();clearSel()});
document.addEventListener('paste',e=>{
 if(free()||!N)return;e.preventDefault();
 const L=e.clipboardData.getData('text/plain').replace(/\r/g,'').split('\n');if(L.length>1&&L[L.length-1]==='')L.pop();
 const s=sp(),ch=[];L.forEach((l,i)=>{const p=s.p1+i;if(p<N)ch.push([rowAt(p),l.split('\t')[0]])});
 if(!ch.length)return;ar=ch[0][0];fr=ch[ch.length-1][0];apply(ch);
});
/* rows */
const ins=(r,n)=>{D.splice(r,0,...Array(n).fill(null));D.length=ROWS};
const del=(r,n)=>{const s=D.splice(r,n);while(D.length<ROWS)D.push(null);return s};
$('bi').onclick=()=>{
 if(view)return toast('ألغِ البحث أولاً');
 const R=rg(),k=R.r2-R.r1+1;
 for(let i=1;i<=k;i++){const x=D[ROWS-i];if(x&&x.some(v=>v))return toast('الصفوف الأخيرة ممتلئة، احذف صفًا أولًا')}
 ins(R.r1,k);push({s:1,u:()=>del(R.r1,k),r:()=>ins(R.r1,k)});dirty();render();toast('تم إدراج '+k+' صف');
};
$('bd').onclick=()=>{
 if(view)return toast('ألغِ البحث أولاً');
 const R=rg(),k=R.r2-R.r1+1,s=del(R.r1,k);
 push({s:1,u:()=>{D.splice(R.r1,0,...s);D.length=ROWS},r:()=>del(R.r1,k)});dirty();render();toast('تم حذف '+k+' صف — يمكنك التراجع');
};
/* search = filter */
let fto=0;
function find(){
 const qs=$('q').value.trim().toLowerCase();
 if(qs){view=[];vpos=new Map();for(let r=0;r<ROWS;r++){const v=gv(r);if(v&&v.toLowerCase().includes(qs)){vpos.set(r,view.length);view.push(r)}}N=view.length;$('cnt').textContent=N+' نتيجة'}
 else{view=null;vpos=null;N=ROWS;$('cnt').textContent=''}
 sz.style.height=HH+N*RH+'px';
 if(view&&N&&pos(ar)<0)ar=fr=view[0];
 g.scrollTop=0;if(!view)reveal(ar);render();
}
$('q').addEventListener('input',()=>{clearTimeout(fto);fto=setTimeout(find,120)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('q').blur()}});
/* import / export (no libraries, works offline) */
function crc(b){let c,k,t=crc.t;if(!t){t=crc.t=[];for(let n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}c=-1;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0}
function zip(files){

async function unzip(buf){
 const v=new DataView(buf),u=new Uint8Array(buf),T=new TextDecoder(),out={};

 const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);
 for(let i=0;i<n;i++){
  const m=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cm=v.getUint16(p+32,true),lo=v.getUint32(p+42,true),name=T.decode(u.subarray(p+46,p+46+nl));
  p+=46+nl+el+cm;
  if(!/^xl\/(sharedStrings|worksheets\/sheet\d+)\.xml$/.test(name))continue;
  const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);let d=u.subarray(ds,ds+cs);
  if(m===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  out[name]=T.decode(d);

}
async function readXlsx(buf){
 const f=await unzip(buf),P=s=>new DOMParser().parseFromString(s,'text/xml'),tx=el=>[...el.getElementsByTagName('t')].map(t=>t.textContent).join('');
 const ss=f['xl/sharedStrings.xml']?[...P(f['xl/sharedStrings.xml']).getElementsByTagName('si')].map(tx):[];
 const k=Object.keys(f).filter(n=>/worksheets/.test(n)).sort()[0];if(!k)throw 0;
 const cells=[];
 for(const c of P(f[k]).getElementsByTagName('c')){
  const m=(c.getAttribute('r')||'').match(/^([A-Z]+)(\d+)$/);if(!m)continue;
  let ci=0;for(const ch of m[1])ci=ci*26+ch.charCodeAt(0)-64;
  const t=c.getAttribute('t');let v='';
  if(t==='inlineStr')v=tx(c);else{const x=c.getElementsByTagName('v')[0];if(x){v=x.textContent;if(t==='s')v=ss[+v]||''}}
  if(v!=='')cells.push([ci,+m[2]-1,v]);

function readCsv(t){return t.replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>{if(l[0]==='"'){const m=l.match(/^"((?:[^"]|"")*)"/);return m?m[1].replace(/""/g,'"'):l}return l.split(/[,;\t]/)[0]})}

async function saveFile(blob,name){
 /* 1) claude.ai artifact: downloads capability */
 try{const dl=window.claude?await claude.use('downloads'):null;if(dl){await dl.save({filename:name,data:blob});return 'ok'}}
 catch(x){if(x&&x.code==='declined')return 'declined'}
 /* 2) mobile: native share sheet (works in installed PWA / iOS) */
 try{const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'ok'}}
 catch(x){if(x&&x.name==='AbortError')return 'declined'}
 /* 3) classic download link */
 const u=URL.createObjectURL(blob),l=document.createElement('a');
 l.href=u;l.download=name;l.style.display='none';document.body.appendChild(l);l.click();
 setTimeout(()=>{l.remove();URL.revokeObjectURL(u)},60000);return 'ok';
}
